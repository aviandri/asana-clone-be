# Mekari Project, full stack: postgres + backend + frontend (nginx serving the SPA, proxying /api to be).
# Expects both repos cloned side by side:
#   ./asana-clone-be   (this repo; run compose from asana-clone-be/deploy)
#   ./asana-clone-fe
# Usage: cp .env.example .env && edit && docker compose up -d --build
#
# The compose project, DB user/database and repo paths keep their original "asana" names on
# purpose: renaming them would detach existing containers and data. See README "Naming".
name: asana-clone

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asana}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  be:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asana}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-asana}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # IANA zone for reports: "today", overdue, Monday week starts.
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      # Name of the workspace the v1.2 upgrade moves existing data into (the entrypoint passes it
      # to the migration) and that create-admin creates on an empty DB. Only used when that
      # workspace is created; rename it later in Workspace settings.
      DEFAULT_WORKSPACE_NAME: ${DEFAULT_WORKSPACE_NAME:-Mekari}
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    # Not published: only reachable through the fe nginx proxy.
    expose:
      - "3000"

  fe:
    build:
      context: ${FE_CONTEXT:-../../asana-clone-fe}
    restart: unless-stopped
    depends_on:
      be:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  pgdata:
    # Pinned to the name compose already derived (<project>_pgdata), so renaming the compose
    # project later can't silently start an empty database.
    name: asana-clone_pgdata
